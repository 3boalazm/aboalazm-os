::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#0B1220}::-webkit-scrollbar-thumb{background:#1E2A44;border-radius:3px}

};
var NAV=[{k:'dashboard',l:'لوحة التحكم',i:'fa-gauge-high'},{k:'sales',l:'أوامر البيع',i:'fa-file-invoice-dollar'},{k:'inventory',l:'المخزون',i:'fa-boxes-stacked'},{k:'crm',l:'العملاء (CRM)',i:'fa-users'},{k:'accounting',l:'الحسابات',i:'fa-coins'},{k:'incentives',l:'الحوافز',i:'fa-trophy'},{k:'products',l:'الأصناف',i:'fa-pills'},{k:'audit',l:'سجل التتبع',i:'fa-shield-halved'}];

function fmt(n){return new Intl.NumberFormat('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' ج.م'}

function Badge(p){return html`<span style=${{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:999,fontSize:11,fontWeight:600,background:p.color+'22',color:p.color}}><span style=${{width:6,height:6,borderRadius:999,background:p.color}} />${p.children}</span>`}
function Card(p){return html`<div style=${{background:C.__bg||'#101A2E',border:'1px solid '+C.border,borderRadius:16,padding:20}} className="anim-fade-up">${p.children}</div>`}
function SecTitle(p){return html`<div style=${{marginBottom:14}}>${p.eyebrow?html`<p className="FM" style=${{fontSize:11,color:C.primary,letterSpacing:'0.08em',marginBottom:4}}>${p.eyebrow}</p>`:null}<h2 style=${{fontSize:17,fontWeight:700}}>${p.title}</h2></div>`}

function Ring(p){
  var r=32,c=2*Math.PI*r,off=c-(p.pct/100)*c;
  return html`<div style=${{position:'relative',width:80,height:80}}>
    <svg width=80 height=80 viewBox="0 0 80 80">
      <circle cx=40 cy=40 r=${r} stroke=${'rgba(148,163,184,0.12)'} strokeWidth=8 fill="none" />
      <circle className="ring" cx=40 cy=40 r=${r} stroke=${p.color} strokeWidth=8 fill="none" strokeDasharray=${c} strokeDashoffset=${off} strokeLinecap="round" transform="rotate(-90 40 40)" />
    </svg>
    <div style=${{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column'}}>
      <span style=${{fontSize:15,fontWeight:700}}>${Math.round(p.pct)}</span>
    </div>
  </div>`;
}

function KpiCard(p){
  return html`<div style=${{background:'#101A2E',border:'1px solid '+C.border,borderRadius:16,padding:18,display:'flex',flexDirection:'column',gap:8}} className="anim-fade-up">
    <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <span className="FM" style=${{fontSize:11,color:C.textDim,letterSpacing:'0.06em'}}>${p.label}</span>
      <div style=${{width:34,height:34,borderRadius:10,background:p.color+'1F',display:'flex',alignItems:'center',justifyContent:'center'}}><i className=${'fas '+p.icon} style=${{color:p.color,fontSize:14}} /></div>
    </div>
    <span style=${{fontSize:24,fontWeight:800}}>${p.value}</span>
    ${p.sub?html`<span style=${{fontSize:12,color:C.textDim}}>${p.sub}</span>`:null}
  </div>`;
}

function DashboardPage(){
  var totalSales=ORDERS.reduce(function(s,o){return s+o.total},0);
  var pending=ORDERS.filter(function(o){return ['DRAFT','PENDING_APPROVAL','APPROVED','ALLOCATING'].indexOf(o.status)>-1}).length;
  var lowStock=PRODUCTS.filter(function(p){return p.status!=='ok'}).length;
  var avgCollection=REPS.reduce(function(s,r){return s+r.collectionRate},0)/REPS.length*100;

  return html`<div style=${{display:'flex',flexDirection:'column',gap:20}}>
    <${SecTitle} eyebrow="نظرة عامة · Q1 2026" title="لوحة تحكم نايل فارما" />
    <div style=${{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:14}}>
      <${KpiCard} label="إجمالي المبيعات" value=${fmt(totalSales)} sub="9 أوامر بيع" icon="fa-sack-dollar" color=${C.primary} />
      <${KpiCard} label="متوسط نسبة التحصيل" value=${avgCollection.toFixed(1)+'%'} sub="عبر 4 مندوبين" icon="fa-chart-pie" color=${C.info} />
      <${KpiCard} label="أوامر قيد التنفيذ" value=${pending} sub="بانتظار الاعتماد أو التخصيص" icon="fa-hourglass-half" color=${C.warning} />
      <${KpiCard} label="تنبيهات نقص مخزون" value=${lowStock} sub="أصناف تحت الحد الأدنى" icon="fa-triangle-exclamation" color=${C.danger} />
    </div>

    <div style=${{display:'grid',gridTemplateColumns:'1.6fr 1fr',gap:16}}>
      <div style=${{background:'#101A2E',border:'1px solid '+C.border,borderRadius:16,padding:20}} className="anim-fade-up">
        <${SecTitle} title="أوامر البيع الأخيرة" />
        <div style=${{display:'flex',flexDirection:'column',gap:2}}>
          ${ORDERS.map(function(o){var m=STATUS_META[o.status];return html`<div key=${o.no} style=${{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid rgba(148,163,184,0.06)'}}>
            <div style=${{display:'flex',flexDirection:'column',gap:2}}>
              <span className="FM" style=${{fontSize:12,color:C.textDim}}>${o.no}</span>
              <span style=${{fontSize:14,fontWeight:500}}>${o.account}</span>
              <span style=${{fontSize:11,color:C.textFaint}}>${o.rep}</span>
            </div>
            <div style=${{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
              <span className="FM" style=${{fontSize:13,fontWeight:600}}>${fmt(o.total)}</span>
              <${Badge} color=${m.c}>${m.l}</${Badge}>
            </div>
          </div>`})}
        </div>
      </div>

      <div style=${{background:'#101A2E',border:'1px solid '+C.border,borderRadius:16,padding:20}} className="anim-fade-up">
        <${SecTitle} title="لوحة صدارة المندوبين" eyebrow="نسبة الكفاءة" />
        <div style=${{display:'flex',flexDirection:'column',gap:16}}>
          ${REPS.slice().sort(function(a,b){return b.efficiencyScore-a.efficiencyScore}).map(function(r,i){
            var ringColor=r.efficiencyScore>=90?C.success:r.efficiencyScore>=70?C.info:C.warning;
            return html`<div key=${r.id} style=${{display:'flex',alignItems:'center',gap:14}}>
              <span className="FM" style=${{fontSize:13,color:C.textFaint,width:16}}>${i+1}</span>
              <${Ring} pct=${r.efficiencyScore} color=${ringColor} />
              <div style=${{flex:1}}>
                <p style=${{fontSize:14,fontWeight:600}}>${r.name}</p>
                <p style=${{fontSize:11,color:C.textDim}}>${r.territory}</p>
                <p className="FM" style=${{fontSize:11,color:C.primary,marginTop:2}}>حافز: ${fmt(r.incentiveEarned)}</p>
              </div>
            </div>`
          })}
        </div>
      </div>
    </div>

    <div style=${{background:'#101A2E',border:'1px solid '+C.border,borderRadius:16,padding:20}} className="anim-fade-up">
      <${SecTitle} title="مستويات المخزون" eyebrow="مخزن القاهرة الرئيسي" />
      <div style=${{display:'flex',flexDirection:'column',gap:12}}>
        ${PRODUCTS.map(function(p){
          var pct=Math.min(100,Math.round(p.stock/(p.min*3)*100));
          var color=p.status==='ok'?C.success:p.status==='low'?C.warning:C.danger;
          return html`<div key=${p.sku}>
            <div style=${{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
              <span>${p.name} <span className="FM" style=${{color:C.textFaint}}>(${p.sku})</span></span>
              <span className="FM" style=${{color:color}}>${p.stock} / حد أدنى ${p.min}</span>
            </div>
            <div style=${{height:8,borderRadius:4,background:'rgba(148,163,184,0.1)',overflow:'hidden'}}>
              <div style=${{height:'100%',width:pct+'%',background:color,borderRadius:4,transition:'width 1s'}} />
            </div>
          </div>`
        })}
      </div>
    </div>
  </div>`;
}

function Table(p){
  return html`<div style=${{background:'#101A2E',border:'1px solid '+C.border,borderRadius:16,padding:20,overflowX:'auto'}} className="anim-fade-up">
    <table style=${{width:'100%',borderCollapse:'collapse',fontSize:13}}>
      <thead><tr>${p.cols.map(function(c){return html`<th key=${c} style=${{textAlign:'right',padding:'8px 10px',color:C.textDim,fontWeight:600,fontSize:11,borderBottom:'1px solid '+C.border}}>${c}</th>`})}</tr></thead>
      <tbody>${p.rows}</tbody>
    </table>
  </div>`;
}

function SalesPage(){
  return html`<div style=${{display:'flex',flexDirection:'column',gap:20}}>
    <${SecTitle} eyebrow="Nile Pharma ERP" title="أوامر البيع (9)" />
    <${Table} cols=${['الرقم','العميل','المندوب','القيمة','الحالة']} rows=${ORDERS.map(function(o){var m=STATUS_META[o.status];return html`<tr key=${o.no} style=${{borderBottom:'1px solid rgba(148,163,184,0.06)'}}>
      <td style=${{padding:'10px'}} className="FM">${o.no}</td>
      <td style=${{padding:'10px'}}>${o.account}</td>
      <td style=${{padding:'10px',color:C.textDim}}>${o.rep}</td>
      <td style=${{padding:'10px'}} className="FM">${fmt(o.total)}</td>
      <td style=${{padding:'10px'}}><${Badge} color=${m.c}>${m.l}</${Badge}></td>
    </tr>`})} />
  </div>`;
}

function InventoryPage(){
  return html`<div style=${{display:'flex',flexDirection:'column',gap:20}}>
    <${SecTitle} eyebrow="Nile Pharma ERP" title="المخزون حسب المخزن" />
    ${WAREHOUSES.map(function(w){return html`<div key=${w.code} style=${{background:'#101A2E',border:'1px solid '+C.border,borderRadius:16,padding:20}} className="anim-fade-up">
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <p style=${{fontWeight:700,fontSize:14}}>${w.name}</p>
        <span className="FM" style=${{fontSize:11,color:C.textFaint}}>${w.code}</span>
      </div>
      <${Table} cols=${['الصنف','الوجبة','الكمية','تاريخ الانتهاء']} rows=${w.items.map(function(it){var prod=PRODUCTS.find(function(p){return p.sku===it.sku});return html`<tr key=${it.sku} style=${{borderBottom:'1px solid rgba(148,163,184,0.06)'}}>
        <td style=${{padding:'8px 10px'}}>${prod?prod.name:it.sku}</td>
        <td style=${{padding:'8px 10px'}} className="FM">${it.batch}</td>
        <td style=${{padding:'8px 10px'}} className="FM">${it.qty}</td>
        <td style=${{padding:'8px 10px'}} className="FM">${it.expiry}</td>
      </tr>`})} />
    </div>`})}
  </div>`;
}

function CrmPage(){
  return html`<div style=${{display:'flex',flexDirection:'column',gap:20}}>
    <${SecTitle} eyebrow="Nile Pharma ERP" title="العملاء (CRM) — 8" />
    <${Table} cols=${['الكود','الاسم','النوع','المندوب','الرصيد']} rows=${ACCOUNTS.map(function(a){return html`<tr key=${a.code} style=${{borderBottom:'1px solid rgba(148,163,184,0.06)'}}>
      <td style=${{padding:'10px'}} className="FM">${a.code}</td>
      <td style=${{padding:'10px'}}>${a.name}</td>
      <td style=${{padding:'10px',color:C.textDim}}>${a.type}</td>
      <td style=${{padding:'10px',color:C.textDim}}>${a.rep}</td>
      <td style=${{padding:'10px'}} className="FM">${a.balance>0?html`<span style=${{color:C.warning}}>${fmt(a.balance)}</span>`:html`<span style=${{color:C.success}}>مسدد</span>`}</td>
    </tr>`})} />
  </div>`;
}

function AccountingPage(){
  return html`<div style=${{display:'flex',flexDirection:'column',gap:20}}>
    <${SecTitle} eyebrow="Nile Pharma ERP" title="الفواتير والتحصيل" />
    <${Table} cols=${['رقم الفاتورة','العميل','الإجمالي','المحصّل','الحالة']} rows=${INVOICES.map(function(i){return html`<tr key=${i.no} style=${{borderBottom:'1px solid rgba(148,163,184,0.06)'}}>
      <td style=${{padding:'10px'}} className="FM">${i.no}</td>
      <td style=${{padding:'10px'}}>${i.account}</td>
      <td style=${{padding:'10px'}} className="FM">${fmt(i.total)}</td>
      <td style=${{padding:'10px'}} className="FM">${fmt(i.paid)}</td>
      <td style=${{padding:'10px'}}><${Badge} color=${i.paid>=i.total?C.success:C.warning}>${i.status}</${Badge}></td>
    </tr>`})} />
  </div>`;
}

function IncentivesPage(){
  return html`<div style=${{display:'flex',flexDirection:'column',gap:20}}>
    <${SecTitle} eyebrow="Nile Pharma ERP · اسكيمة 2026" title="سجل الحوافز" />
    <${Table} cols=${['المندوب','الطلب','الأساس','العمولة','الحالة']} rows=${INCENTIVE_LEDGER.map(function(l,i){return html`<tr key=${i} style=${{borderBottom:'1px solid rgba(148,163,184,0.06)'}}>

      <td style=${{padding:'10px'}}><${Badge} color=${l.status==='مدفوع'?C.success:l.status==='معتمد'?C.info:C.warning}>${l.status}</${Badge}></td>
    </tr>`})} />
  </div>`;
}

function ProductsPage(){
  return html`<div style=${{display:'flex',flexDirection:'column',gap:20}}>
    <${SecTitle} eyebrow="Nile Pharma ERP" title="كتالوج الأصناف (8)" />
    <${Table} cols=${['SKU','الاسم','العلامة','السعر','المخزون']} rows=${PRODUCTS.map(function(p){return html`<tr key=${p.sku} style=${{borderBottom:'1px solid rgba(148,163,184,0.06)'}}>
      <td style=${{padding:'10px'}} className="FM">${p.sku}</td>
      <td style=${{padding:'10px'}}>${p.name}</td>
      <td style=${{padding:'10px',color:C.textDim}}>${p.brand}</td>
      <td style=${{padding:'10px'}} className="FM">${fmt(p.price)}</td>

}

function AuditPage(){
  return html`<div style=${{display:'flex',flexDirection:'column',gap:20}}>
    <${SecTitle} eyebrow="Nile Pharma ERP" title="سجل التتبع (Event Stream)" />
    <${Table} cols=${['الوقت','الحدث','المرجع','الفاعل']} rows=${AUDIT_LOG.map(function(e,i){return html`<tr key=${i} style=${{borderBottom:'1px solid rgba(148,163,184,0.06)'}}>

      <td style=${{padding:'10px',color:C.info}} className="FM">${e.event}</td>
      <td style=${{padding:'10px'}} className="FM">${e.ref}</td>
      <td style=${{padding:'10px',color:C.textDim}}>${e.actor}</td>
    </tr>`})} />

function App(){
  var ps=useState('dashboard'),page=ps[0],setPage=ps[1];
  var ms=useState(false),mobOpen=ms[0],setMobOpen=ms[1];
  var pages={dashboard:DashboardPage,sales:SalesPage,inventory:InventoryPage,crm:CrmPage,accounting:AccountingPage,incentives:IncentivesPage,products:ProductsPage,audit:AuditPage};
  var Page=pages[page]||DashboardPage;

  return html`<div className="bg-mesh" style=${{display:'flex',minHeight:'100vh'}}>
    ${mobOpen?html`<div onClick=${function(){setMobOpen(false)}} style=${{position:'fixed',inset:0,zIndex:45,background:'rgba(0,0,0,0.5)'}} />`:null}
    <aside className=${'sidebar-el'+(mobOpen?' mob-open':'')} style=${{width:250,flexShrink:0,minHeight:'100vh',background:'#0D1626',borderLeft:'1px solid '+C.border,display:'flex',flexDirection:'column'}}>
      <div style=${{padding:20,display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid '+C.border}}>
        <div style=${{width:36,height:36,borderRadius:10,background:C.primaryDim,display:'flex',alignItems:'center',justifyContent:'center'}}><i className="fas fa-pills" style=${{color:C.primary}} /></div>
        <div><p style=${{fontWeight:700,fontSize:14}}>Nile Pharma</p><p className="FM" style=${{fontSize:10,color:C.textFaint}}>ERP Console</p></div>
      </div>
      <nav style=${{flex:1,padding:'12px',display:'flex',flexDirection:'column',gap:2}}>
        ${NAV.map(function(n){var act=page===n.k;return html`<button key=${n.k} onClick=${function(){setPage(n.k);setMobOpen(false)}} style=${{display:'flex',alignItems:'center',gap:12,padding:'10px 12px',borderRadius:10,border:'1px solid '+(act?'rgba(20,184,166,0.25)':'transparent'),background:act?C.primaryDim:'transparent',cursor:'pointer',width:'100%',textAlign:'right',color:act?C.text:C.textDim,fontWeight:act?600:400,fontSize:13}}>
          <i className=${'fas '+n.i} style=${{width:16,color:act?C.primary:C.textFaint}} />${n.l}
        </button>`})}
      </nav>
      <div style=${{padding:16,borderTop:'1px solid '+C.border,fontSize:11,color:C.textFaint}}>معاينة توضيحية — Aboalazm OS</div>
    </aside>
    <main style=${{flex:1,padding:'28px 32px',maxWidth:'100%',overflow:'hidden'}}>
      <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}}>
        <button onClick=${function(){setMobOpen(true)}} style=${{display:'none',background:'#101A2E',border:'1px solid '+C.border,borderRadius:8,padding:8,color:C.text}} className="mob-toggle"><i className="fas fa-bars" /></button>
        <div />
        <div style=${{display:'flex',alignItems:'center',gap:10}}>
          <span className="FM" style=${{fontSize:11,color:C.textFaint}}>7 يناير 2026</span>
          <div style=${{width:32,height:32,borderRadius:999,background:C.primaryDim,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:C.primary}}>أ.ف</div>
        </div>
      </div>
      <${Page} />
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
<style>@media(max-width:900px){.mob-toggle{display:flex !important}}</style>
</body>
</html>
