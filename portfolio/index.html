<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mustafa Aboalazm — Portfolio 2026 · بورتفوليو</title>
<meta name="description" content="Fixed-format bilingual portfolio — Mustafa Aboalazm, Systemic Identity Architect. Brand identity, design systems & web. Exportable to A4 PDF.">
<meta name="author" content="Mustafa Aboalazm">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080710'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23FF6B47' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/portfolio.css">
</head>
<body>

<noscript>
  <div style="padding:48px;font-family:monospace;color:#F8F8FA;background:#080710">
    This portfolio renders via JavaScript — enable JS, or open README.md for details.<br>
    البورتفوليو محتاج تشغيل الجافاسكريبت.
  </div>
</noscript>

<!-- Pages render here -->
<main id="pages" aria-label="Portfolio pages"></main>

<!-- ══════════ SCREEN-ONLY CONTROL DOCK ══════════ -->
<nav id="dock" aria-label="Portfolio controls">
  <div class="dock-lang" role="group" aria-label="Section jump">
    <button data-goto="cover"  title="Cover">COVER</button>
    <button data-goto="work"   title="Work">WORK</button>
    <button data-goto="offers" title="Offers">OFFERS</button>
    <button data-goto="contact" title="Contact">CONTACT</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-print" class="dock-btn" title="Print / Save as PDF (Ctrl+P)">
    <span aria-hidden="true">⌘</span> PRINT · طباعة
  </button>
  <button id="btn-export" class="dock-btn dock-btn--accent" title="Export exact A4 PDF">
    <span aria-hidden="true">↓</span> PDF · تحميل
  </button>
</nav>

<!-- ══════════ EXPORT PROGRESS OVERLAY ══════════ -->
<div id="progress" hidden aria-live="polite">
  <div class="progress-card">
    <p class="progress-title">RENDERING PDF · جاري التصدير</p>
    <div class="progress-track"><div id="progress-bar"></div></div>
    <p class="progress-meta"><span id="progress-page">PAGE 0/0</span> — keep this tab focused · سيب التاب مفتوح</p>
    <button id="progress-cancel">CANCEL · إلغاء</button>
  </div>
</div>

<!-- Libraries (lazy-loaded on first export) + app -->
<script src="assets/img.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/export.js"></script>
</body>
</html>
